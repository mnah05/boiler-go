version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "sql/schema.sql"
    queries:
      - "sql/queries/"
    gen:
      go:
        package: "db"
        out: "internal/repository/db"
        # sqlx wraps database/sql, so generate the standard database/sql query
        # interface rather than pgx-specific pool and transaction types.
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: false
