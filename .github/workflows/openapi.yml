name: openapi

# Keeps generated Swagger docs in sync with code annotations.
# - Pull requests: fails if docs/ is stale (run `make swagger` locally).
# - Pushes to main: regenerates and commits the update back.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is unnecessary; a single commit suffices since we
          # only diff the working tree against the checked-out commit.
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install swag
        run: make swagger-install

      - name: Regenerate OpenAPI docs
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make swagger

      - name: Fail if docs are stale (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is stale. Run 'make swagger' locally and commit the result."
            exit 1
          }

      - name: Commit updated docs (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/; then
            echo "docs/ already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: regenerate OpenAPI spec"
          git push
